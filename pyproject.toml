[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-demo"
version = "0.1.0"
description = "Projeto de demonstração de CI/CD/CT para ML"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "joblib==1.6.0",
    "pyyaml==6.0.4",
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# ferramentas de desenvolvimento: lint, testes e cliente HTTP do TestClient
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
]
# ferramentas do treinamento contínuo: pipeline versionado com DVC
ct = [
    "dvc==3.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "codigo: testes de código (funções e pipeline)",
    "dados: testes de dados (esquema, valores, vazamento)",
    "modelo: testes de modelo (limiar, baseline, comportamento)",
    "api: testes de contrato da API",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
